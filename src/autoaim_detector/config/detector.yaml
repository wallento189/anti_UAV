autoaim_detector:
  ros__parameters:
    image_topic: autoaim_camera/image_raw
    detection_topic: autoaim_detector/detection
    labeled_image_topic: autoaim_detector/labeled_image
    # 板上走 BPU 时改为 model_path: <模型>.bin、enable_gpu: false、enable_bpu: true
    model_path: "finetuned_p2.onnx"
    enable_gpu: true
    enable_bpu: false
    enable_labeled_image: true
    confidence_thres: 0.2
