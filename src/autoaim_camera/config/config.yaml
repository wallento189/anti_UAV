autoaim_camera:
  ros__parameters:
    device: /dev/video0
    fourcc: MJPG
    width: 1280
    height: 720
    fps: 60.0
    # Window published to image_topic, in capture-frame pixels.
    # For 1280x720 -> 640x480 centered: crop_x=320, crop_y=120.
    crop_x: 320
    crop_y: 120
    crop_width: 640
    crop_height: 480
    frame_id: camera_optical
    image_topic: autoaim_camera/image_raw
    buffer_size: 4
    camera_info_topic: autoaim_camera/camera_info
    camera_info_url: package://autoaim_camera/config/camera_info.yaml
